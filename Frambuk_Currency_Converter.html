<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/x-icon" href="images/Frambuk-Icon.png">

<title>African & Global Currency Converter</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.container{
    width:100%;
  /*  max-width:1400px;*/
    background:rgba(5,11,20,.76);
    border-radius:25px;
    padding:30px;
    box-shadow:0 15px 50px rgba(0,0,0,0.5);
}

h1{
    text-align:center;
    color:#facc15;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:30px;
}

.controls{
    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:30px;
}

.control-box{
    display:flex;
    flex-direction:column;
    gap:8px;
}

label{
    color:#cbd5e1;
    font-size:14px;
}

input, select{
    padding:15px;
    border:none;
    border-radius:12px;
    background:#1e293b;
    color:white;
    font-size:16px;
    min-width:240px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:20px;
}

.card{
    background:#1e293b !important;
    border-radius:20px;
    padding:20px;
    transition:0.3s;
    border:1px solid rgba(255,255,255,0.05);
}

.card:hover{
    background: #1e293b !important;
    transform:translateY(-5px);
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.currency-name{
    color:#facc15 !important;
    font-size:18px;
    margin-bottom:10px;
}
#baseCurrency {
    color: facc15;
    background: 1e293b;
}
.amount{
    font-size:30px;
    font-weight:bold;
    word-break:break-word;
}

.updated{
    text-align:center;
    margin-top:30px;
    color:#94a3b8;
}

@media(max-width:768px){

    h1{
        font-size:2rem;
    }

    .controls{
        flex-direction:column;
    }

    input, select{
        width:100%;
    }

}

.header{
  position:sticky;top:0;z-index:1000;border-bottom:1px solid var(--line);
  background:rgba(5,11,20,.76);backdrop-filter:blur(18px);
}
.header-container{max-width:1400px;margin:auto;padding:14px 24px;display:flex;align-items:center;gap:28px}
.logo img{height:42px;max-width:170px;object-fit:contain}
.hamburger{display:none;font-size:24px;cursor:pointer}
nav{display:flex;gap:10px;flex:1}
nav a{color:#dbeafe;text-decoration:none;padding:10px 14px;border-radius:10px;transition:.25s}
nav a:hover,nav a.active{background:rgba(250,196,0,.12);color:#fac400}
.header-icons{display:flex;gap:14px;font-size:20px}.header-icons div{cursor:pointer}

</style>
</head>

<body>
  
<header class="header">
 <div class="header-container">
  <div class="hamburger" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></div>
  <div class="logo"><a href="index.html"><img src="images/Frambuk-Logo.png" alt="Frambuk"></a></div>
  <nav id="menu"><a class="active" href="index.html">Home</a><a href="index.html#apps">Free To Use Apps</a></nav>
  <div class="header-icons"><div title="Cart">🛒 <span id="cartCount">0</span></div><div title="Checkout">💳</div></div>
 </div>
</header>

<div class="container">

    <h1 style="color: #facc15;">🌍 Real-Time USD-African Currency Converter</h1>

    <p class="subtitle">
        Convert currencies into African and international currencies concurrently in real time.
    </p>

    <div class="controls">

        <div class="control-box">
            <label>Enter Amount</label>
            <input type="number" id="amount" value="1" min="1">
        </div>

        <div class="control-box">
            <label>Select Base Currency</label>
            <select id="baseCurrency"></select>
        </div>

    </div>

    <div class="grid" id="currencyGrid"></div>

    <div class="updated" id="updatedTime">
        Updating...
    </div>

</div>

<script>

const currencies = {

    USD: "USA Dollar",
    NGN: "Nigerian Naira",

    ZAR: "South African Rand",
    EGP: "Egyptian Pound",
    KES: "Kenyan Shilling",
    GHS: "Ghanaian Cedi",
    MAD: "Moroccan Dirham",
    ETB: "Ethiopian Birr",

    EUR: "Euro",
    CAD: "Canadian Dollar",
    AUD: "Australian Dollar",
    JPY: "Japanese Yen",
    CNY: "Chinese Yuan"

};

const targetCurrencies = [

    "USD",
    "NGN",

    "ZAR",
    "EGP",
    "KES",
    "GHS",
    "MAD",
    "ETB",

    "EUR",
    "CAD",
    "AUD",
    "JPY",
    "CNY"

];

const amountInput = document.getElementById("amount");
const baseCurrencySelect = document.getElementById("baseCurrency");
const currencyGrid = document.getElementById("currencyGrid");
const updatedTime = document.getElementById("updatedTime");

for(let currency in currencies){

    let option = document.createElement("option");

    option.value = currency;

    option.textContent = `${currency} - ${currencies[currency]}`;

    baseCurrencySelect.appendChild(option);

}

baseCurrencySelect.value = "USD";

async function convertCurrencies(){

    const amount = amountInput.value;
    const base = baseCurrencySelect.value;

    currencyGrid.innerHTML = `
        <div style="grid-column:1/-1;text-align:center;">
            Fetching live exchange rates...
        </div>
    `;

    try{

        const response = await fetch(
            `https://api.exchangerate-api.com/v4/latest/${base}`
        );

        const data = await response.json();

        currencyGrid.innerHTML = "";

        targetCurrencies.forEach(currency => {

            if(currency !== base){

                const rate = data.rates[currency];

                if(rate){

                    const converted = (amount * rate).toFixed(2);

                    const card = document.createElement("div");

                    card.className = "card";

                    card.innerHTML = `

                        <div class="currency-name">
                            ${currency} - ${currencies[currency]}
                        </div>

                        <div class="amount">
                            ${converted}
                        </div>

                    `;

                    currencyGrid.appendChild(card);

                }

            }

        });

        updatedTime.innerHTML = `
            Last Updated: ${new Date().toLocaleTimeString()}
        `;

    }catch(error){

        currencyGrid.innerHTML = `
            <div style="grid-column:1/-1;text-align:center;color:red;">
                Failed to fetch exchange rates.
            </div>
        `;

    }

}

amountInput.addEventListener("input", convertCurrencies);

baseCurrencySelect.addEventListener("change", convertCurrencies);

convertCurrencies();

setInterval(convertCurrencies, 60000);

</script>

  </body>

</html>
